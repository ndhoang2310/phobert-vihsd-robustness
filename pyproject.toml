[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vihsd-robustness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "pyarrow>=17", "numpy>=1.26,<3", "matplotlib>=3.8", "seaborn>=0.13", "scikit-learn>=1.5", "scipy>=1.12", "pyyaml>=6", "tqdm>=4.66", "py-vncorenlp==0.1.4", "transformers==4.57.1", "huggingface-hub>=0.34,<1", "accelerate>=1.2,<2", "torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5", "kaggle>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
